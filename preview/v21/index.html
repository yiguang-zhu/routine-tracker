/* V2.1 — focused per-activity insights and searchable icons */
.insights-grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:12px}
.insight-card{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:17px 17px 15px;color:var(--text);transition:box-shadow .2s,transform .2s}
.insight-card:active{transform:scale(.992)}
.insight-card-top{display:flex;align-items:center;gap:11px;min-width:0}
.insight-card-top>.row-icon{width:39px;height:39px}
.insight-card-top>svg{width:16px;height:16px;color:#bdc6bf;flex:none}
.insight-card-title{min-width:0;flex:1;font-size:15px;font-weight:730;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insight-card-title small{display:block;font-size:11px;font-weight:450;color:var(--muted);margin-top:4px}
.insight-frequency{display:flex;gap:10px;align-items:baseline;margin-top:22px;margin-bottom:19px}
.insight-frequency-label{font-size:12px;color:var(--muted);font-weight:620}
.insight-frequency strong{font-size:27px;font-weight:775;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.insight-metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:13px;gap:4px}
.insight-metrics>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.insight-metrics>div+div{border-left:1px solid var(--line);padding-left:14px}
.insight-metrics strong{font-size:17px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.insight-metrics small{font-size:11px;color:var(--muted)}
.detail-frequency{display:flex;gap:12px;align-items:baseline;margin-bottom:18px}
.detail-frequency small{font-size:12px;color:var(--muted)}
.detail-frequency strong{font-size:28px;letter-spacing:-.7px}
.detail-metrics{padding-bottom:10px}
.detail-section-title{font-size:13px;margin:22px 0 9px}
.detail-dates{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.detail-date{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;padding:12px 13px;border-bottom:1px solid var(--line)}
.detail-date:last-child{border-bottom:0}
.detail-date span+span{color:var(--accent);font-size:11px}
.emoji-tool{width:100%;min-width:0}
.emoji-current{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.emoji-current>span{width:47px;height:47px;background:#f2f6f1;border-radius:14px;display:grid;place-items:center;font-size:26px}
.emoji-current strong{display:block;font-size:13px}
.emoji-current small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.emoji-categories{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:9px;margin-bottom:3px}
.emoji-categories::-webkit-scrollbar{display:none}
.emoji-category{flex:none;background:#f4f6f3;border:1px solid transparent;border-radius:999px;padding:8px 12px;color:#65736d;font-size:11px;font-weight:680}
.emoji-category.active{background:var(--accent-wash);color:var(--accent-dark);border-color:#cfe8de}
.emoji-search{display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:#f9faf8;border-radius:11px;height:42px;padding:0 11px}
.emoji-search svg{width:17px;height:17px;color:#93a09a;flex:none}
.emoji-search input{min-width:0;width:100%;background:none;border:0;outline:0;font-size:12px;color:var(--text)}
.emoji-search input:focus-visible{outline:0}
.emoji-gallery{border:1px solid var(--line);border-radius:13px;margin:10px 0 16px;padding:10px;max-height:238px;min-height:70px;overflow-y:auto;overscroll-behavior:contain}
.emoji-section+.emoji-section{margin-top:12px}
.emoji-group-title{font-size:11px;font-weight:720;color:var(--muted);margin:1px 3px 8px}
.emoji-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.emoji-grid .emoji-option{font-size:21px;border-radius:9px;min-width:0;min-height:38px;aspect-ratio:1}
.emoji-empty{font-size:12px;color:var(--muted);padding:10px}
.emoji-custom-label{font-size:12px;color:#697571;font-weight:700;display:flex;justify-content:space-between;gap:8px;margin:0 0 8px}
.emoji-custom-label span{font-size:11px;color:var(--muted);font-weight:450}
.emoji-custom-input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#f9faf8;color:var(--text);font-size:17px}
.preview-banner{margin-bottom:20px;background:#eff5f0;color:#385c50;border:1px solid #d6e6dc;padding:12px 14px;border-radius:14px;font-size:12px;line-height:1.5}
.preview-banner span{display:inline-flex;background:#d8ece2;color:#215a45;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:740;margin-right:8px}
@media(min-width:760px){.insights-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.insights-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

// Local-only storage. No data is transmitted to a server.
const DB_NAME = 'routine-tracker-v21-preview';
const DB_VERSION = 1;
const STORE = 'documents';
let databasePromise;

function makeId() {
  return globalThis.crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
}

function originalInitialState() {
  const createdAt = new Date().toISOString();
  const names = [
    ['Laundry', '🧺'],
    ['Grocery', '🛒'],
    ['Dine out', '🍽️'],
    ['Cleaning', '🧹'],
    ['Workout', '🏸'],
  ];
  return {
    schema: 2,
    activities: names.map(([name, emoji], index) => ({ id: makeId(), name, emoji, order: index, archived: false, createdAt })),
    logs: [],
    meta: { createdAt, lastExportAt: null, reminderSnoozedUntil: null, readOnly: false, importedAt: null },
  };
}

function openDatabase() {
  if (!('indexedDB' in globalThis)) return Promise.reject(new Error('此浏览器不支持 IndexedDB'));
  if (!databasePromise) {
    databasePromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('无法打开本地数据库'));
      request.onblocked = () => reject(new Error('本地数据库被其他标签页占用'));
    }).catch(error => { databasePromise = null; throw error; });
  }
  return databasePromise;
}

async function readLocal() {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const request = tx.objectStore(STORE).get('state');
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error || new Error('读取本地数据失败'));
  });
}

async function writeLocal(state) {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(state, 'state');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('保存失败'));
    tx.onabort = () => reject(tx.error || new Error('保存已中止'));
  });
}

function isValidISO(value) {
  return typeof value === 'string' && Number.isFinite(Date.parse(value));
}

function parseBackup(raw) {
  if (!raw || typeof raw !== 'object' || raw.app !== 'routine-tracker' || raw.version !== 2) {
    throw new Error('不支持的备份格式，请选择 Routine V2 导出的 JSON 文件。');
  }
  if (!Array.isArray(raw.activities) || !Array.isArray(raw.logs) || raw.activities.length > 10000 || raw.logs.length > 500000) {
    throw new Error('备份文件缺少事项或记录，或内容过多。');
  }
  const activities = raw.activities.map((a, index) => {
    if (!a || typeof a.id !== 'string' || typeof a.name !== 'string' || !a.name.trim() || a.name.length > 80) {
      throw new Error(`第 ${index + 1} 个事项格式错误。`);
    }
    return { id: a.id, name: a.name.trim(), emoji: typeof a.emoji === 'string' ? a.emoji.slice(0, 12) : '✦',
      order: Number.isFinite(a.order) ? a.order : index, archived: a.archived === true,
      createdAt: isValidISO(a.createdAt) ? a.createdAt : new Date().toISOString() };
  });
  const activityIds = new Set(activities.map(a => a.id));
  const logs = raw.logs.map((l, index) => {
    if (!l || typeof l.id !== 'string' || !activityIds.has(l.activityId) || !isValidISO(l.occurredAt)) {
      throw new Error(`第 ${index + 1} 条记录格式错误。`);
    }
    return { id: l.id, activityId: l.activityId, occurredAt: l.occurredAt,
      recordedAt: isValidISO(l.recordedAt) ? l.recordedAt : l.occurredAt };
  });
  return { schema: 2, activities, logs,
    meta: { createdAt: isValidISO(raw.createdAt) ? raw.createdAt : new Date().toISOString(),
      lastExportAt: null, reminderSnoozedUntil: null, readOnly: false, importedAt: null } };
}

function toBackup(state) {
  return { app: 'routine-tracker', version: 2, exportedAt: new Date().toISOString(),
    createdAt: state.meta.createdAt, activities: state.activities, logs: state.logs };
}

function initialState() {
  const data=originalInitialState();
  const samples=[
    [0,[5,12,22,30,40]],
    [1,[1,8,15,23]],
    [2,[0,3,5,8,12,18,21,25]],
    [3,[10,25,35]],
    [4,[0,2,5,7,9,12,14,17,20,24]],
  ];
  for(const [index,days] of samples) {
    for(const offset of days){
      const when=new Date();when.setHours(12,0,0,0);when.setDate(when.getDate()-offset);
      const occurredAt=when.toISOString();
      data.logs.push({id:makeId(),activityId:data.activities[index].id,occurredAt,recordedAt:occurredAt});
    }
  }
  data.meta.lastExportAt=new Date().toISOString();
  return data;
}

function escAttr(value) { return escapeHTML(value); }
function dateKey(date) { const d = new Date(date); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseLocalDate(value) { const [y,m,d] = value.split('-').map(Number); return new Date(y,m-1,d,12); }
function dayNumber(value) { const [y,m,d] = value.split('-').map(Number); return Math.floor(Date.UTC(y,m-1,d)/DAY); }
function dayDiff(start, end = dateKey(Date.now())) { return dayNumber(end) - dayNumber(start); }
function todayKey() { return dateKey(Date.now()); }
function dateShort(value) { return new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric'}).format(new Date(value)); }
function dateLong(value) { return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(value)); }
function since(iso) { if (!iso) return '尚无记录'; const days = dayDiff(dateKey(iso)); if (days < 0) return '未来日期'; if (days === 0) return '今天'; if (days === 1) return '昨天'; return `${days} 天前`; }
function active() { return state.activities.filter(a=>!a.archived).sort((a,b)=>a.order-b.order); }
function activityById(id) { return state.activities.find(a=>a.id===id); }
function entriesByActivity(id) { return state.logs.filter(l=>l.activityId===id).sort((a,b)=>b.occurredAt.localeCompare(a.occurredAt)); }

function inLastDays(iso, days) { const n=dayDiff(dateKey(iso)); return n>=0 && n<days; }

function median(values) { if(!values.length) return null; const a=[...values].sort((x,y)=>x-y); const mid=Math.floor(a.length/2); return a.length%2?a[mid]:(a[mid-1]+a[mid])/2; }

function filterEmojiPicker() {
  const tool=document.getElementById('emojiTool');if(!tool)return;
  const query=document.getElementById('emojiSearch').value.toLocaleLowerCase().trim();
  let matches=0;
  tool.querySelectorAll('.emoji-section').forEach(section=>{
    const group=section.dataset.iconGroup;
    const groupAllowed=query?true:tool.dataset.category===group;
    let localMatches=0;
    section.querySelectorAll('.emoji-option').forEach(option=>{
      const match=groupAllowed && (!query || option.dataset.iconSearch.includes(query));
      option.hidden=!match;
      if(match)localMatches++;
    });
    section.hidden=!localMatches;
    matches+=localMatches;
  });
  tool.querySelector('#emojiEmpty').hidden=matches!==0;
  // Searching shows matching icons from all categories.
}
function chooseEmoji(value) {
  const tool=document.getElementById('emojiTool');if(!tool)return;

  const grapheme=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(selected)][0]?.segment:[...selected][0];
  if(!grapheme)return;
  const emoji=grapheme.slice(0,12);
  tool.querySelector('#emojiSelected').textContent=emoji;
  tool.querySelector('#emojiInput').value=emoji;
  tool.querySelector('#emojiCustom').value=emoji;
  tool.querySelectorAll('.emoji-option').forEach(button=>{
    const selected=button.dataset.emoji===emoji;
    button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected));

async function resetData(){if(!confirm('清除这台设备上的全部事项和历史记录？\n\n此操作无法撤销。建议先导出备份。'))return;if(!confirm('请再次确认：真的要清除全部数据吗？'))return;state={schema:2,activities:[],logs:[],meta:{createdAt:new Date().toISOString(),lastExportAt:null,reminderSnoozedUntil:null,readOnly:false,importedAt:null}};currentPage='home';render();await persist();toast('这台设备的数据已清除');}

async function exportFile(format='json'){

  let exported=false;
  const file=new File([blob],filename,{type:blob.type});
  if(navigator.canShare?.({files:[file]})){
    try {await navigator.share({files:[file],title:filename});exported=true;}catch(e){if(e.name==='AbortError')return;}
  }
  if(!exported){downloadBlob(filename,blob);exported=true;}
  if(format==='json'&&exported){state.meta.lastExportAt=new Date().toISOString();state.meta.reminderSnoozedUntil=null;await persist();render();}

async function importBackup(event){

  if(file.size>20*1024*1024){toast('备份超过 20MB，请检查文件');return;}
  try{
    const backup=parseBackup(JSON.parse(await file.text()));
    if(importMode==='restore') {
      if(!confirm(`将从 ${backup.activities.length} 个事项、${backup.logs.length} 条记录恢复数据。\n\n这会覆盖本设备当前存储的全部数据。是否继续？`))return;

      if(!confirm(`以只读方式查看 ${backup.activities.length} 个事项、${backup.logs.length} 条记录？\n\n这会替换本设备现有的本地数据（如有）。iPhone 上的原始数据不受影响。`))return;

document.addEventListener('input',event=>{
  if(event.target.id==='emojiSearch') filterEmojiPicker();
  if(event.target.id==='emojiCustom' && event.target.value.trim()) chooseEmoji(event.target.value);
});
document.addEventListener('input',event=>{
  if(event.target.id!=='activitySearch')return;
  const query=event.target.value.toLocaleLowerCase().trim();
  document.querySelectorAll('#activityGrid .activity-card[data-name]').forEach(card=>{card.hidden=!card.dataset.name.includes(query);});
});
importFile.addEventListener('change',importBackup);
document.addEventListener('keydown',event=>{if(event.key==='Escape')dismissModal();});
window.addEventListener('hashchange',()=>{if(!modalRoot.innerHTML && ['home','insights','history','settings'].includes(location.hash.slice(1)))navigate(location.hash.slice(1));});
async function init(){
  try{const data=await readLocal();state=data&&data.schema===2?data:initialState();if(!data)await writeLocal(state);}catch(err){
    console.error('IndexedDB unavailable',err);app.innerHTML=`<div class="empty-state"><strong>无法使用本地存储</strong><p>Routine 需要 iPhone 浏览器的 IndexedDB 保存记录。请关闭无痕浏览，检查 Safari 网站数据设置，然后重新打开页面。<br>${escapeHTML(err.message)}</p></div>`;nav.style.display='none';return;
  }
  const desired=location.hash.slice(1);currentPage=['home','insights','history','settings'].includes(desired)?desired:'home';render();
  if(!PREVIEW && 'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline cache unavailable',err));
  navigator.storage?.persist?.().catch(()=>{});
}
init();

  </script>
